<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>فرست تاچ - سامانه تخصصی آموزش و مربیگری فوتبال</title>
    <!-- Vazirmatn Font Preload -->
    <link rel="preload" href="/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/Vazirmatn-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Critical Asset Preloader (Loads all nav images in memory immediately) -->
    <script>
      (function() {
        var preloads = [
          '/firsttouchcrop.png',
          '/glossy-profile-icon.png',
          '/healthy-eating-banner.png',
          '/nutrition-cat-1.png',
          '/nutrition-cat-2.png',
          '/nutrition-cat-3.png',
          '/nutrition-plan-progress-card.png',
          '/nutrition-promo-banner.png',
          '/neon-training-banner.png',
          '/category-1.png',
          '/category-2.png',
          '/category-3.png',
          '/category-4.png',
          '/category-5.png',
          '/training-plan-progress-card.png',
          '/drill-thumb-cones.png',
          '/drill-thumb-agility.png',
          '/drill-thumb-passing.png',
          '/pro-trophy-banner.png'
        ];
        for (var i = 0; i < preloads.length; i++) {
          var img = new Image();
          img.src = preloads[i];
        }
      })();
    </script>
    <!-- Fallback Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-primary/20 selection:text-primary">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
